metadata = {
    format = { version = "1.0" }
    polyglot-extensions = [plugins]
}

plugins = {
    "net.kyori.indra" = "4.1.0"
    "net.kyori.indra.checkstyle" = "4.1.0"
    "com.gradleup.shadow" = "9.6.1"
}

versions = {
    velocity = "4.3.0"
    configurate = "4.2.0"
    cloud-velocity = "2.0.1"
    cloud-annotations = "2.1.0"
    luckperms = "5.5"
}

dependencies = {
    velocity-api = { group = "com.velocitypowered", name = "velocity-api", version.ref = "velocity" }
    configurate-hocon = { group = "org.spongepowered", name = "configurate-hocon", version.ref = "configurate" }
    cloud-velocity = { group = "org.incendo", name = "cloud-velocity", version.ref = "cloud-velocity" }
    cloud-annotations = { group = "org.incendo", name = "cloud-annotations", version.ref = "cloud-annotations" }
    luckperms = { group = "net.luckperms", name = "api", version.ref = "luckperms" }
}
